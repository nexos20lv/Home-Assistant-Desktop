<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Assistant Desktop</title>
    <link rel="stylesheet" href="shell.css">
</head>

<body>
    <div id="titlebar">
        <div class="app-icon">
            <img src="../assets/logo.svg" alt="HA" />
        </div>
        <span id="gamepad-indicator" class="gamepad-indicator" title="Controller connected" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M7,6H17A6,6 0 0,1 23,12A6,6 0 0,1 17,18C15.22,18 13.63,17.23 12.53,16H11.47C10.37,17.23 8.78,18 7,18A6,6 0 0,1 1,12A6,6 0 0,1 7,6M6,9V11H4V13H6V15H8V13H10V11H8V9H6M15.5,12A1.5,1.5 0 0,0 14,13.5A1.5,1.5 0 0,0 15.5,15A1.5,1.5 0 0,0 17,13.5A1.5,1.5 0 0,0 15.5,12M18.5,9A1.5,1.5 0 0,0 17,10.5A1.5,1.5 0 0,0 18.5,12A1.5,1.5 0 0,0 20,10.5A1.5,1.5 0 0,0 18.5,9Z" />
            </svg>
        </span>
        <div class="app-title" id="app-title">Home Assistant Desktop</div>
        <div id="network-pill" class="network-pill offline" data-i18n-offline="shell.offline">Offline</div>
        <div class="window-controls">
            <!-- Mac/Windows specific controls if we were fully custom, but we use titleBarOverlay for buttons -->
        </div>
        <div class="app-actions">
            <button id="widget-btn" title="Quick Overlay Widget" data-i18n-title="shell.widget">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H5v-6h6v6zm0-8H5V5h6v4zm8 8h-6v-4h6v4zm0-6h-6V5h6v6z"/>
                </svg>
            </button>
            <button id="pip-btn" title="Picture-in-Picture" data-i18n-title="shell.pip">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M21,3H3C1.9,3,1,3.9,1,5v14c0,1.1,0.9,2,2,2h18c1.1,0,2-0.9,2-2V5C23,3.9,22.1,3,21,3z M21,19H3V5h18V19z M19,11h-8v6h8V11z" />
                </svg>
            </button>
            <button id="params-btn" title="Preferences" data-i18n-title="shell.preferences">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M19.14,12.94C19.14,12.78 19.11,12.63 19.11,12.47C19.11,12.32 19.14,12.16 19.14,12C19.14,11.84 19.11,11.69 19.11,11.53C19.11,11.37 19.14,11.22 19.14,11.06L21.41,9.29C21.62,9.13 21.68,8.83 21.54,8.6L19.39,4.88C19.25,4.64 18.96,4.55 18.72,4.64L16.03,5.73C15.47,5.3 14.87,4.95 14.22,4.68L13.82,1.82C13.78,1.55 13.55,1.36 13.28,1.36H8.97C8.7,1.36 8.47,1.56 8.43,1.82L8.03,4.68C7.38,4.95 6.78,5.3 6.22,5.73L3.53,4.64C3.29,4.55 3,4.64 2.86,4.88L0.71,8.6C0.57,8.83 0.63,9.13 0.84,9.29L3.11,11.06C3.11,11.22 3.14,11.37 3.14,11.53C3.14,11.69 3.11,11.84 3.11,12C3.11,12.16 3.14,12.32 3.14,12.47C3.14,12.63 3.11,12.78 3.11,12.94L0.84,14.71C0.63,14.87 0.57,15.17 0.71,15.4L2.86,19.12C3,19.36 3.29,19.45 3.53,19.36L6.22,18.27C6.78,18.7 7.38,19.05 8.03,19.32L8.43,22.18C8.47,22.44 8.7,22.64 8.97,22.64H13.28C13.55,22.64 13.78,22.44 13.82,22.18L14.22,19.32C14.87,19.05 15.47,18.7 16.03,18.27L18.72,19.36C18.96,19.45 19.25,19.36 19.39,19.12L21.54,15.4C21.68,15.17 21.62,14.87 21.41,14.71L19.14,12.94M12,15.5C10.07,15.5 8.5,13.93 8.5,12C8.5,10.07 10.07,8.5 12,8.5C13.93,8.5 15.5,10.07 15.5,12C15.5,13.93 13.93,15.5 12,15.5Z" />
                </svg>
            </button>
            <button id="disconnect-btn" title="Disconnect / Reset URL" data-i18n-title="shell.disconnect">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M17,7L15.59,8.41L18.17,11H8V13H18.17L15.59,15.58L17,17L22,12L17,7M4,5H12V3H4A2,2 0 0,0 2,5V19A2,2 0 0,0 4,21H12V19H4V5Z" />
                </svg>
            </button>
        </div>
    </div>
    <script src="../locales/i18n.js"></script>
    <script src="gamepad-input.js"></script>
    <script>
        const appTitle = document.getElementById('app-title');
        const gamepadIndicator = document.getElementById('gamepad-indicator');
        const networkPill = document.getElementById('network-pill');
        let networkTarget = 'offline';
        let gamepadHintTimer = null;

        // Initialize i18n titles for shell buttons
        function updateShellI18n() {
            document.getElementById('widget-btn').title = i18n.t('shell.widget', 'Quick Overlay Widget');
            document.getElementById('pip-btn').title = i18n.t('shell.pip', 'Picture-in-Picture');
            document.getElementById('params-btn').title = i18n.t('shell.preferences', 'Preferences');
            document.getElementById('disconnect-btn').title = i18n.t('shell.disconnect', 'Disconnect / Reset URL');
            gamepadIndicator.title = i18n.t('shell.controllerConnected', 'Controller connected');
        }

        function renderNetworkPill() {
            networkPill.classList.remove('local', 'remote', 'offline');
            networkPill.classList.add(networkTarget);

            if (networkTarget === 'local') networkPill.textContent = i18n.t('shell.local', 'Local');
            else if (networkTarget === 'remote') networkPill.textContent = i18n.t('shell.remote', 'Remote');
            else networkPill.textContent = i18n.t('shell.offline', 'Offline');
        }

        window.addEventListener('i18n-language-changed', () => {
            updateShellI18n();
            renderNetworkPill();
        });
        document.addEventListener('DOMContentLoaded', updateShellI18n);

        // i18n.js only holds the lookup logic; the strings have to be loaded into it.
        fetch('../locales/translations.json')
            .then((response) => response.json())
            .then((translations) => {
                i18n.loadTranslations(translations);
                updateShellI18n();
                renderNetworkPill();
            })
            .catch(() => {});

        document.getElementById('disconnect-btn').addEventListener('click', () => {
            if (window.electronAPI) window.electronAPI.resetConfig();
        });

        document.getElementById('widget-btn').addEventListener('click', () => {
            if (window.electronAPI) window.electronAPI.toggleWidget();
        });

        document.getElementById('pip-btn').addEventListener('click', () => {
            if (window.electronAPI) window.electronAPI.togglePiP();
        });

        document.getElementById('params-btn').addEventListener('click', () => {
            if (window.electronAPI) window.electronAPI.openPreferences();
        });

        if (window.electronAPI && window.electronAPI.onThemeChanged) {
            window.electronAPI.onThemeChanged((theme) => {
                document.body.className = theme ? `theme-${theme}` : '';
            });
        }

        if (window.electronAPI && window.electronAPI.onNetworkStatus) {
            window.electronAPI.onNetworkStatus((status) => {
                networkTarget = (status && status.target) || 'offline';
                renderNetworkPill();
            });
        }

        // gamepad-input.js: the first time a controller is used, show its button map in place of the title.
        window.addEventListener('gamepad-activity', () => {
            gamepadIndicator.hidden = false;
            if (gamepadHintTimer !== null) return;
            appTitle.textContent = i18n.t('shell.controllerHint', 'D-pad: move · A: select · B: back · Menu: sidebar · View: full screen');
            appTitle.classList.add('hint');
            gamepadHintTimer = setTimeout(() => {
                appTitle.textContent = 'Home Assistant Desktop';
                appTitle.classList.remove('hint');
            }, 8000);
        });

        window.addEventListener('gamepad-idle', () => {
            gamepadIndicator.hidden = true;
        });
    </script>
</body>

</html>
