<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Home Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <svg viewBox="0 0 24 24" width="64" height="64">
                    <path fill="currentColor" d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z" />
                </svg>
            </div>
            <h1 id="setup-title">Assistant de connexion</h1>
            <p class="subtitle" id="setup-subtitle">Configuration guidée en 3 étapes.</p>

            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px; justify-content: center;">
                <label for="setup-language-select" style="font-size: 12px; color: rgba(255,255,255,0.7);" id="language-label">Language:</label>
                <select id="setup-language-select" style="padding: 6px 10px; border-radius: 4px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); font-size: 12px; min-width: 120px;">
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="nl">Nederlands</option>
                </select>
            </div>

            <div class="stepper" aria-label="Étapes d'installation">
                <div class="step-dot active">1</div>
                <div class="step-line"></div>
                <div class="step-dot">2</div>
                <div class="step-line"></div>
                <div class="step-dot">3</div>
            </div>

            <div class="step-panel active" id="step-local">
                <h2 id="title-local">URL locale</h2>
                <p class="step-help" id="help-local">Adresse interne de Home Assistant sur ton réseau local.</p>
                <div class="input-group">
                    <input type="text" id="local-url-input" placeholder="homeassistant.local:8123" required>
                </div>
            </div>

            <div class="step-panel" id="step-remote">
                <h2 id="title-remote">URL distante</h2>
                <p class="step-help" id="help-remote">Facultatif, utilisé quand tu es hors de chez toi.</p>
                <div class="input-group">
                    <input type="text" id="remote-url-input" placeholder="xyz.ui.nabu.casa">
                </div>
            </div>

            <div class="step-panel" id="step-token">
                <h2 id="title-token">Token API</h2>
                <p class="step-help" id="help-token">Facultatif ici, tu peux le modifier plus tard dans Préférences.</p>
                <div class="input-group">
                    <input type="password" id="token-input" placeholder="Long-lived access token">
                </div>
            </div>

            <p id="autofix-hint" class="hint hidden"></p>
            <p id="status-box" class="status hidden"></p>

            <div class="actions-row">
                <button id="back-btn" class="btn-secondary" type="button">Retour</button>
                <button id="test-btn" class="btn-secondary" type="button">Tester</button>
                <button id="next-btn" type="button">Continuer</button>
                <button id="finish-btn" class="hidden" type="button">Terminer</button>
            </div>
        </div>
    </div>
    <script src="../locales/i18n.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
