name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  version:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Auto-Version & Tag
        id: version
        shell: bash
        run: |
          # Create version based on run number: 1.0.<run_number>
          NEW_VERSION="1.0.${{ github.run_number }}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Update package.json
          npm version $NEW_VERSION --no-git-tag-version
          
          # Configure Git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Commit the version bump
          git add package.json
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          git commit -m "chore: release v$NEW_VERSION [skip ci]"
          
          # Pull latest changes to avoid conflicts (though less likely in a single job)
          git pull origin main --rebase
          
          git push origin main

          # Create and push tag
          git tag v$NEW_VERSION
          git push origin v$NEW_VERSION

  build:
    name: Build on ${{ matrix.os }}
    needs: version
    if: always() && (needs.version.result == 'success' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.version.outputs.version && format('refs/tags/v{0}', needs.version.outputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      # Linux specific setup for rpm/dpkg if needed
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build & Make
        run: npm run make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version && format('v{0}', needs.version.outputs.version) || github.ref_name }}
          files: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.msi
            out/make/*.dmg
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm
